<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNDERSTUDY · UI 화면 뷰어</title>
  <style>
    :root { color-scheme: dark; --gold: #d2a848; --ink: #0c0a0a; --panel: #171212; --line: #4d3820; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #302214 0, var(--ink) 46%); color: #f4e7c6; font: 15px/1.4 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgb(12 10 10 / 88%); }
    h1 { margin: 0; font-size: 18px; letter-spacing: .08em; color: var(--gold); white-space: nowrap; }
    select { min-width: 230px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; color: inherit; background: var(--panel); }
    #position { margin-left: auto; color: #bca982; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - 65px); }
    .viewer { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; align-items: center; min-height: 0; }
    button { width: 46px; height: 80px; justify-self: center; border: 1px solid var(--line); border-radius: 6px; color: var(--gold); background: #1c1511; cursor: pointer; font-size: 34px; }
    button:hover { background: #312313; }
    figure { display: grid; place-items: center; margin: 0; min-height: 0; padding: 20px; }
    img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 155px); object-fit: contain; border: 1px solid #6d5128; box-shadow: 0 14px 45px #000a; background: #080707; }
    figcaption { width: min(100%, 1200px); padding-top: 11px; font-size: 16px; text-align: center; color: #dbc58f; }
    #description { max-width: 900px; margin: 0 auto 18px; padding: 10px 18px; color: #c8b991; text-align: center; }
    .hint { margin: 0; padding: 0 24px 16px; text-align: center; color: #897856; font-size: 13px; }
    @media (max-width: 620px) { header { flex-wrap: wrap; gap: 8px; } #position { margin-left: 0; } .viewer { grid-template-columns: 46px minmax(0, 1fr) 46px; } button { width: 38px; height: 58px; } figure { padding: 8px; } img { max-height: calc(100vh - 190px); } }
  </style>
</head>
<body>
  <header>
    <h1>UNDERSTUDY · 화면 뷰어</h1>
    <select id="screen" aria-label="화면 선택"></select>
    <span id="position"></span>
  </header>
  <main>
    <section class="viewer" aria-label="화면 미리보기">
      <button id="previous" type="button" aria-label="이전 화면">‹</button>
      <figure>
        <img id="preview" alt="">
        <figcaption id="caption"></figcaption>
      </figure>
      <button id="next" type="button" aria-label="다음 화면">›</button>
    </section>
    <p id="description"></p>
    <p class="hint">← → 키 또는 버튼으로 넘기기 · 화면 선택 목록으로 바로 이동</p>
  </main>
  <script>
    const screens = [
      ['전체 UI 흐름도', 'flow-map/preview-1920.png', '게임의 모든 화면과 이동 경로를 한 장에 정리한 지도입니다. 금색 선은 기본 진행, 적색 선은 지도 복귀, 하단은 공용 오버레이입니다.'],
      ['메인 메뉴', 'main-menu/preview-v3.png', '새 게임을 시작하거나 저장된 여정을 이어가는 첫 화면입니다. 설정과 극장 기록으로도 진입합니다.'],
      ['감독 선택', 'director-select/preview.png', '이번 여정을 이끌 감독을 고릅니다. 감독마다 시작 덱, 유품, 최대 비용 같은 운영 방식이 달라집니다.'],
      ['공연 준비', 'performance-prep/preview.png', '공연 전에 대본과 장비를 점검하고 출발하는 허브입니다. 선택을 마치면 이야기 또는 지도 여정으로 이어집니다.'],
      ['이야기 장면', 'story/preview.png', '막 사이의 서사를 보여주는 화면입니다. 선택지나 사건의 맥락을 전달한 뒤 다음 여정으로 넘깁니다.'],
      ['여정 지도', 'map/preview.png', '다음 공연, 상점, 휴식, 사건 중 갈 곳을 선택합니다. 경로 선택이 이번 막에서 얻을 자원과 위험을 결정합니다.'],
      ['전투', 'combat/assembled-existing-ui-preview.png', '릴을 돌려 나온 3개의 심볼로 대본을 만들고, 비용 안에서 공연해 적을 쓰러뜨리는 핵심 플레이 화면입니다.'],
      ['슬롯 머신', 'slots/slot-machine-3of4-assembled.png', '전투 안에서 사용하는 3릴 슬롯 장치입니다. 심볼 조합이 대본 후보를 만들며, 각 릴의 재굴림 버튼으로 결과를 조정합니다.'],
      ['공연 보상', 'reward/preview.png', '공연을 마친 뒤 새 대본, 유물 또는 자원을 고르는 보상 화면입니다. 다음 전투의 빌드 방향을 정합니다.'],
      ['극장 기록', 'theatre-records/preview.png', '계정 단위로 쌓이는 대본 도서관, 유물 보관, 공연 이력을 확인하는 메타 진행 허브입니다.'],
      ['도감', 'compendium/preview.png', '만난 대본과 적, 유물의 정보를 다시 보는 화면입니다. 해금한 콘텐츠와 조합 힌트를 기록합니다.'],
      ['소품실 · 상점', 'shop/preview.png', '골드를 써서 유물과 소품을 사는 화면입니다. 즉시 전투력을 보완하거나 장기 빌드에 투자합니다.'],
      ['복원 목록', 'restoration/preview-v4.png', '실패한 여정에서도 남은 재료로 영구 해금 또는 복원 항목을 고릅니다. 다음 여정의 선택지를 넓힙니다.'],
      ['재연 · 공연 이력', 'reenactment/preview-v2.png', '과거 공연 기록을 보고 재연 목표를 고르는 화면입니다. 달성한 이력과 남은 과제를 확인합니다.'],
      ['각색실', 'dramaturgy/preview.png', '대본의 조합과 성능을 다듬는 공간입니다. 보유한 카드와 유물에 맞춰 공연용 선택지를 조정합니다.'],
      ['즉흥극', 'event/preview.png', '지도에서 만나는 위험과 기회를 선택하는 사건 화면입니다. 즉각적인 이득과 이후의 부담 사이를 판단합니다.'],
      ['분장실', 'dressing-room/preview.png', '감독과 극단의 준비 상태를 확인하고 외형 또는 장비 성격을 조정하는 화면입니다.'],
      ['오디션', 'audition/preview-v2.png', '후보 3명 중 한 명을 선택해 극단에 새 능력이나 운영 방향을 더하는 선택 화면입니다.'],
      ['유물 보물', 'relic-treasure/preview.png', '세 유물 중 하나를 선택합니다. 유물은 릴, 비용, 대본 성능처럼 규칙 자체에 지속 효과를 줍니다.'],
      ['극단 성장', 'troupe-growth/preview-v4.png', '극단 전체에 적용되는 성장 보상을 하나 고릅니다. 다음 막의 시작 조건이나 장기적인 빌드를 강화합니다.'],
      ['막 전환', 'act-transition/preview.png', '한 막의 끝과 다음 막의 시작을 알리는 전환 화면입니다. 적과 난이도가 바뀌기 전 흐름을 정리합니다.'],
      ['승리 정산', 'run-result/preview-victory-v2.png', '여정을 완주했을 때의 기록과 해금 보상을 보여줍니다. 메타 진행에 남길 성과를 확인합니다.'],
      ['패배 정산', 'run-result/preview-defeat-v1.png', '여정이 끝난 이유와 남긴 성과를 정리합니다. 실패해도 복원 재료나 이력이 다음 도전으로 이어집니다.'],
      ['시스템 메뉴', 'system-menu/preview.png', '일시정지, 사운드·표시 설정, 여정 포기 확인을 담는 공용 메뉴입니다.'],
      ['공용 오버레이', 'overlays/preview-details-performance-v3.png', '대본 상세, 선택 가능 여부, 확인 창처럼 다른 화면 위에 겹쳐 표시되는 정보와 선택 UI입니다.']
    ];

    const select = document.querySelector('#screen');
    const image = document.querySelector('#preview');
    const caption = document.querySelector('#caption');
    const description = document.querySelector('#description');
    const position = document.querySelector('#position');
    let index = 0;

    screens.forEach(([name], i) => select.add(new Option(name, i)));
    function show(nextIndex) {
      index = (nextIndex + screens.length) % screens.length;
      const [name, path, detail] = screens[index];
      image.src = path;
      image.alt = `${name} 화면`;
      caption.textContent = name;
      description.textContent = detail;
      position.textContent = `${index + 1} / ${screens.length}`;
      select.value = index;
    }
    document.querySelector('#previous').addEventListener('click', () => show(index - 1));
    document.querySelector('#next').addEventListener('click', () => show(index + 1));
    select.addEventListener('change', () => show(Number(select.value)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(index - 1);
      if (event.key === 'ArrowRight') show(index + 1);
    });
    show(0);
  </script>
</body>
</html>
