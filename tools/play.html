<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UNDERSTUDY — 플레이 시뮬레이터</title>
<style>
  /* ──────────────────────────────────────────────────────────────
     좌표계 — 극장 레이어는 전부 1672x941 한 장의 캔버스를 공유한다
     (UI/theater/README.md). 그래서 모든 배치는 % 로만 적는다.
     슬롯은 1024x592 를 공유한다 (UI/slots/README.md).
     아래 % 값은 눈대중이 아니라 각 PNG 의 실제 내용 경계를 재서 나왔다.
     ────────────────────────────────────────────────────────────── */
  :root {
    --ink:#0a0908; --panel:#15110d; --raised:#1d1710; --line:#3b2c1a; --line2:#5d4522;
    --gold:#d2a848; --goldd:#8d7136; --text:#e8dcc2; --muted:#9b8b6c; --faint:#6d6049;
    --red:#8e3b34; --green:#7f9a72; --blue:#7f95b0; --purple:#8b7aa8;
    color-scheme: dark;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background:#000; color:var(--text);
         font:400 13px/1.5 "Malgun Gothic",system-ui,sans-serif;
         display:grid; place-items:center; }
  img { display:block; }

  /* ── 게임 프레임 — 뷰포트에 레터박스로 맞춘다. 페이지는 스크롤하지 않는다 ── */
  .game { position:relative; background:#000; overflow:hidden; user-select:none;
          width:min(100vw, calc(100vh * 1672 / 941));
          height:min(100vh, calc(100vw * 941 / 1672));
          container-type:size; container-name:game; }
  .lyr { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  /* 표시 토글은 display 를 요소별로 되돌린다.
     한 줄로 display:block 을 씌우면 .stagearea 의 flex 와 .cheerwrap 의 flex 가 함께 죽는다. */
  .game .runonly, .game .fightonly { display:none; }
  .game.run .runonly { display:inline-flex; align-items:center; }
  .game.run .hpwrap,
  .game.run .costwrap,
  .game.run .director { display:block; }
  .game.fight .stagearea { display:flex; }

  /* 감독 — 작업대보다 앞, 화면 맨 왼쪽 하단 (theater/README 권장 영역) */
  .director { position:absolute; left:-1.2%; top:55.3%; width:23.9%; aspect-ratio:1;
         pointer-events:none; z-index:6; }

  /* ── 상단바 ── */
  .topbar { position:absolute; left:0; right:0; top:0; height:5.2%; z-index:20;
            display:flex; align-items:center; gap:1.4%; padding:0 1.2%;
            font-size:clamp(9px,.85vw,13px); color:var(--muted); letter-spacing:.04em; }
  .topbar .act { color:var(--gold); letter-spacing:.1em; white-space:nowrap; }
  .topbar b { color:var(--text); font-weight:400; font-variant-numeric:tabular-nums; }
  .relics { display:flex; gap:.35em; margin-left:.6em; }
  .relics span { font-size:1.15em; cursor:help; }
  .cheerwrap { margin-left:auto; display:flex; align-items:center; gap:.5em; white-space:nowrap; }
  .cheerbar { position:relative; width:clamp(90px,14vw,240px); height:.85em;
              border:1px solid var(--line2); background:#120e09; overflow:hidden; }
  .cheerbar>i { display:block; height:100%; transition:width .25s;
                background:linear-gradient(180deg,#e2bd63,#a8842f); }
  .cheerbar.hot>i { background:linear-gradient(180deg,#f0cf7a,#c8912f); }
  .cheerbar u { position:absolute; top:0; bottom:0; width:1px; background:#00000066; }

  /* ── 무대 위의 적 ── */
  .stagearea { position:absolute; left:15%; right:15%; top:7%; height:39.5%; z-index:2;
               display:flex; align-items:flex-end; justify-content:center; gap:2.4%; }
  .foe { position:relative; flex:0 1 22%; min-width:0; height:100%; display:flex;
         flex-direction:column; align-items:center; justify-content:flex-end;
         gap:1.5%; cursor:default; }
  .foe.aim { cursor:crosshair; }
  /* 슬더슬처럼 대본을 끌어다 적 위에 놓는다 */
  .hc { touch-action:none; }
  .hc.dragging { opacity:.25; }
  #ghost { position:fixed; z-index:70; pointer-events:none; transform:translate(-50%,-60%) scale(.82);
    filter:drop-shadow(0 10px 22px #000c); opacity:.96; }
  .foe.over .body { border-color:var(--gold) !important;
    box-shadow:inset 0 0 44px #d2a84855, 0 0 22px #d2a848aa !important; }
  .foe.over::after { content:'⌖'; position:absolute; left:50%; top:34%; transform:translate(-50%,-50%);
    font-size:clamp(26px,3vw,46px); color:var(--gold); text-shadow:0 0 12px #000; pointer-events:none; }
  #dragline { position:fixed; inset:0; z-index:69; pointer-events:none; }

  /* 뜨는 숫자 — 로그에만 있던 피해를 무대 위로 올린다 */
  @keyframes flt {   0% { opacity:0; transform:translate(-50%,10px) scale(.7) }
                    14% { opacity:1; transform:translate(-50%,-4px) scale(1.18) }
                    26% { transform:translate(-50%,-8px) scale(1) }
                   100% { opacity:0; transform:translate(-50%,-46px) scale(.95) } }
  .flt { position:absolute; left:50%; top:34%; z-index:24; pointer-events:none;
    font-weight:900; font-size:clamp(20px,2.4vw,38px); letter-spacing:-.03em; white-space:nowrap;
    text-shadow:0 2px 0 #000, 0 0 14px #000c; animation:flt .95s cubic-bezier(.2,.9,.3,1) forwards; }
  .flt.dmg  { color:#ff7a63; }
  .flt.big  { color:#ffd166; font-size:clamp(26px,3.1vw,50px); }
  .flt.heal { color:#8ede8e; }
  .flt.blk  { color:#9fc4e0; font-size:clamp(15px,1.7vw,26px); }
  .flt.dot  { color:#e08a4a; font-size:clamp(15px,1.7vw,26px); }

  /* 맞는 쪽이 흔들려야 때린 것이 보인다 */
  @keyframes hitk { 0%{transform:translateX(0)} 18%{transform:translateX(-8px)}
                   38%{transform:translateX(7px)} 60%{transform:translateX(-4px)}
                  100%{transform:translateX(0)} }
  .foe.hit .body { animation:hitk .3s ease-out;
    border-color:#ff7a63 !important; box-shadow:inset 0 0 44px #ff3b2a66, 0 0 18px #ff3b2a44 !important; }
  .foe.hit .glyph { filter:brightness(2.2) saturate(.3); }

  /* 퇴장 — 막 뒤로 쓰러진다 */
  @keyframes gone { 0%{opacity:1;transform:translateY(0) rotate(0)}
                  100%{opacity:.12;transform:translateY(14px) rotate(-7deg)} }
  .foe.dead .body { animation:gone .55s ease-in forwards; }

  /* 내가 맞으면 화면이 흔들리고 가장자리가 붉어진다 */
  @keyframes shk { 0%{transform:translate(0,0)} 22%{transform:translate(-7px,4px)}
                  48%{transform:translate(6px,-4px)} 74%{transform:translate(-4px,2px)}
                 100%{transform:translate(0,0)} }
  .shake { animation:shk .32s ease-out; }
  #hurt { position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0;
    background:radial-gradient(ellipse at 50% 55%, #0000 42%, #b8202099 100%); }
  @keyframes hurtk { 0%{opacity:0} 10%{opacity:1} 100%{opacity:0} }
  #hurt.on { animation:hurtk .55s ease-out; }

  /* 막이 내린다 — 전투가 끝날 때 한 번 */
  #curtain { position:fixed; inset:0; pointer-events:none; z-index:58; opacity:0;
    display:grid; place-items:center; background:#0b0708e0; }
  #curtain b { font-size:clamp(24px,3.4vw,54px); font-weight:900; color:var(--gold);
    letter-spacing:.22em; text-shadow:0 0 30px #000, 0 2px 0 #000; }
  @keyframes curk { 0%{opacity:0} 18%{opacity:1} 62%{opacity:1} 100%{opacity:0} }
  #curtain.on { animation:curk 1.1s ease-out; }
  .foe.dead { opacity:.2; filter:grayscale(1); }
  .foe .body { width:100%; flex:1 1 auto; min-height:0; position:relative;
               background:linear-gradient(180deg,#1a141088,#0d0a07dd);
               border:1px solid #4a3722; box-shadow:inset 0 0 30px #0009; }
  .foe.aim .body { border-color:var(--gold); box-shadow:inset 0 0 30px #0009, 0 0 14px #d2a84855; }
  .foe .body .sil { position:absolute; inset:12% 8% 6%; opacity:.62;
                    background:currentColor; color:#2a1f14;
                    -webkit-mask:radial-gradient(ellipse 42% 26% at 50% 15%,#000 62%,transparent 64%),
                                 linear-gradient(#000,#000);
                    -webkit-mask-composite:source-over; }
  .foe .glyph { position:absolute; inset:0; display:grid; place-items:center;
                font-size:clamp(20px,3.2vw,54px); filter:grayscale(.45) brightness(.85); }
  .foe .nm { font-size:clamp(12px,1.05vw,17px); font-weight:800; color:var(--gold); text-align:center;
             text-shadow:0 1px 3px #000; line-height:1.25; }
  .foe .hpb { width:100%; height:1.05em; min-height:11px; border:1px solid #7a4a34; background:#170f0c;
    box-shadow:inset 0 1px 3px #000a; }
  .foe .hpb>i { display:block; height:100%; background:linear-gradient(180deg,#a8514a,#6d2f2a); }
  .foe .blb { width:100%; height:.4em; min-height:4px; border:1px solid #3a4a5a; background:#0f1317; }
  .foe .blb>i { display:block; height:100%; background:#5a6b7a; }
  .foe .num { font-size:clamp(13px,1.15vw,19px); font-weight:800; color:#e8d5bd; letter-spacing:-.01em;
    text-shadow:0 1px 2px #000;
              font-variant-numeric:tabular-nums; text-shadow:0 1px 2px #000; }
  .foe .it { font-size:clamp(14px,1.25vw,20px); font-weight:800; color:#ffca8a; background:#2a1206ee;
    border:1px solid #8a5a2a; border-radius:3px; padding:.15em .4em; text-shadow:0 1px 2px #000;
             border:1px solid var(--line2); padding:.1em .5em; white-space:nowrap;
             text-shadow:0 1px 2px #000; }
  .foe .tag { font-size:clamp(6px,.6vw,10px); color:var(--faint); text-align:center;
              line-height:1.45; max-height:5.4em; overflow:hidden; }
  .foe .amp { font-size:clamp(6px,.6vw,10px); color:#c49a6a; min-height:1em; }

  /* ── 무대 안내 배너 ── */
  .banner { position:absolute; left:50%; top:43.2%; transform:translateX(-50%); z-index:8;
            background:#12100acc; border:1px solid var(--line2); padding:.25em 1.4em;
            font-size:clamp(8px,.8vw,12px); color:var(--gold); letter-spacing:.16em;
            white-space:nowrap; text-shadow:0 1px 3px #000; }

  /* ── 슬롯 (1024x592 캔버스) ── */
  .slotwrap { position:absolute; left:34.65%; top:42%; width:30.7%; aspect-ratio:1024/592;
              z-index:9; }
  .slotwrap .sl { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .win { position:absolute; top:30.6%; height:34.5%; width:16.48%; overflow:hidden;
         background:#0d0a07; }
  .win .belt { position:absolute; inset:0; background-size:100% 100%; opacity:.85;
               background-image:url(../UI/slots/slot-reel-repeat-strip.png); }
  .win .sym { position:absolute; inset:8%; background-size:contain; background-repeat:no-repeat;
              background-position:center; transition:transform .12s; }
  .win .emo { position:absolute; inset:0; display:grid; place-items:center;
              font-size:clamp(14px,2.2vw,34px); }
  .win.spin .sym, .win.spin .emo { animation:reelspin .18s linear infinite; }
  @keyframes reelspin { from{transform:translateY(-46%)} to{transform:translateY(46%)} }
  .win.shut { background:#1a0d0d; }
  .win.shut::after { content:""; position:absolute; inset:0;
                     background:repeating-linear-gradient(90deg,#5a1f1f,#5a1f1f 3px,#3d1414 3px,#3d1414 7px);
                     opacity:.9; }
  .win.void { filter:grayscale(1) brightness(.5); }
  .knob { position:absolute; top:66.9%; height:15.5%; width:7.8%; border:0; background:none;
          padding:0; cursor:pointer; z-index:12; }
  .knob:disabled { cursor:default; }
  .knob i { position:absolute; left:31%; right:31%; top:10%; bottom:10%; border-radius:50%;
            box-shadow:0 0 0 2px #00000055; transition:transform .07s, box-shadow .18s; }
  .knob:not(:disabled):hover i { box-shadow:0 0 10px 2px #d2a84899; }
  .knob:not(:disabled):active i { transform:translateY(3px); }
  .knob.lock i { box-shadow:0 0 0 2px var(--gold), 0 0 12px 3px #d2a848aa;
                 background:#d2a8482e; }
  .knob:disabled i { opacity:.35; }
  .lockmark { position:absolute; right:6%; top:5%; font-size:.9cqw; line-height:1;
              text-shadow:0 1px 3px #000; pointer-events:none; }
  .win.locked { box-shadow:inset 0 0 0 2px var(--gold); }
  /* 재스핀 — 슬롯 오른쪽 모터 하우징 옆 */
  .respin { position:absolute; left:50%; transform:translateX(-50%); top:86%;
            background:#14100ae6; border:1px solid var(--line2); color:var(--gold);
            padding:.25em 1em; font:inherit; font-size:.95cqw; letter-spacing:.04em;
            cursor:pointer; white-space:nowrap; z-index:13; }
  .respin b { font-weight:400; color:var(--text); }
  .respin:hover:not(:disabled) { background:#2a1f10; border-color:var(--gold); }
  .respin:disabled { opacity:.4; cursor:default; }
  .respin.free { box-shadow:0 0 10px #d2a84855; }
  .slotcap { position:absolute; left:0; right:0; top:100%; margin-top:.4cqw; text-align:center;
             font-size:clamp(7px,.7vw,11px); color:var(--muted); text-shadow:0 1px 3px #000; }
  .slotcap b { color:var(--gold); font-weight:400; }

  /* ── HP · 코스트 ── */
  .hpwrap { position:absolute; left:0; top:47.8%; width:23.5%; aspect-ratio:442/76; z-index:14; }
  .hpwrap .f { position:absolute; inset:0; width:100%; height:100%; }
  .hpwrap .heart { position:absolute; left:3.2%; top:14.5%; width:11.8%; aspect-ratio:52/54; }
  .hptrack { position:absolute; left:16.3%; top:30.3%; width:52%; height:38.2%;
             overflow:hidden; background:#1a0d0b; }
  .hptrack>i { display:block; height:100%; width:0; transition:width .3s;
               background:url(../UI/hud/hp/fill.png) left center/auto 100% repeat-x; }
  .hpnum { position:absolute; right:3.5%; top:0; bottom:0; width:26%;
           display:grid; place-items:center; color:var(--gold);
           font-size:clamp(9px,1.05vw,17px); font-variant-numeric:tabular-nums;
           text-shadow:0 1px 3px #000; }

  .costwrap { position:absolute; left:10.5%; top:59.8%; width:23%; aspect-ratio:402/91; z-index:14; }
  .costwrap .f { position:absolute; inset:0; width:100%; height:100%; }
  .costwrap .mask { position:absolute; left:3.5%; top:22%; width:11.9%; aspect-ratio:48/56; }
  .costnum { position:absolute; left:0; right:0; top:6%; height:32%; line-height:1;
             display:grid; place-items:center; color:var(--text);
             font-size:clamp(10px,1.15vw,19px); font-variant-numeric:tabular-nums;
             text-shadow:0 1px 3px #000; }
  .costnum s { text-decoration:none; color:var(--muted); font-size:.72em; }
  .sockets { position:absolute; left:19.4%; top:55%; height:26%; display:flex; }
  .sockets img { height:100%; width:auto; margin-right:.32em; }

  /* ── 손패 ── */
  .handwrap { position:absolute; left:22%; right:8%; bottom:1.5%; height:33%; z-index:16;
              display:flex; align-items:flex-end; justify-content:center; }
  .hrow { width:100%; display:flex; align-items:flex-end; justify-content:center; height:100%; }
  .hc { position:relative; flex:0 0 auto; width:12.9%; max-width:150px; aspect-ratio:384/533;
        border:0; background:none; padding:0; font:inherit; color:var(--text); cursor:pointer;
        margin-right:-1.8%; transform-origin:50% 100%; transition:transform .16s, filter .16s;
        filter:drop-shadow(0 6px 12px #000a); }
  .hc .base { position:absolute; inset:0; width:100%; height:100%; }
  .hc:hover:not(.dis) { transform:translateY(-9%) scale(1.1); z-index:3; }
  .hc.pend { transform:translateY(-13%) scale(1.12); z-index:4;
             filter:drop-shadow(0 0 10px #d2a848cc); }
  .hc.dis { filter:grayscale(.7) brightness(.62); cursor:default; }
  .hc.tip .base { outline:2px solid var(--green); outline-offset:-3px; }
  .hc.seal { filter:grayscale(1) brightness(.45); cursor:default; }
  .hc.temp .base { outline:1px dashed var(--purple); outline-offset:-4px; }
  .hc .cost { position:absolute; left:7%; top:4.5%; width:22%; aspect-ratio:1;
              display:grid; place-items:center; color:#2b1d0c; font-weight:700;
              font-size:clamp(8px,.82vw,14px);
              background:url(../UI/icons/resources/runtime/cost-theatre-gem-192.png) center/contain no-repeat; }
  .hc .ttl { position:absolute; left:8%; right:6%; top:27%; text-align:center;
             font-size:clamp(6px,.62vw,10px); color:#3a2a17; line-height:1.2;
             max-height:2.5em; overflow:hidden; }
  .hc .req { position:absolute; left:8%; right:8%; top:41%; display:flex;
             justify-content:center; gap:3%; }
  .hc .req span { width:17%; aspect-ratio:1; background-size:contain;
                  background-repeat:no-repeat; background-position:center;
                  filter:sepia(.5) contrast(1.1); border-radius:50%; }
  /* 요구 심볼의 출처를 구분한다 — 무대에 있는 것 / 대역이 채운 것 / 없는 것 */
  .hc .req .wild { box-shadow:0 0 0 1.5px #c8912f, 0 0 5px #d2a848cc;
                   filter:sepia(.15) contrast(1.15) brightness(1.12); }
  .hc .req .slack { box-shadow:0 0 0 1.5px #7f9a72, 0 0 5px #7f9a72aa;
                    filter:sepia(.2) contrast(1.1); }
  .hc .req .miss { opacity:.3; filter:grayscale(1) contrast(.9); }
  .hc .why { position:absolute; left:6%; right:6%; top:53%; text-align:center;
             font-size:.62cqw; color:#8e3b34; letter-spacing:.04em; }
  .hc:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .hc:disabled { cursor:default; }
  .wildmark { position:absolute; left:0; right:0; bottom:3%; text-align:center;
              font-size:.72cqw; letter-spacing:.16em; color:#f0cf7a;
              text-shadow:0 1px 3px #000, 0 0 6px #d2a84899; pointer-events:none; }
  .hc .req em { font-style:normal; font-size:clamp(6px,.6vw,10px); color:#4a3520; }
  .hc .eff { position:absolute; left:6%; right:6%; bottom:7%; text-align:center;
             font-size:clamp(6px,.62vw,10px); color:#3a2a17; line-height:1.25;
             max-height:3.6em; overflow:hidden; }
  .hc .ok { position:absolute; right:7%; top:5%; font-size:clamp(7px,.7vw,11px); }
  .hc .ok.no { color:#8e3b34; } .hc .ok.yes { color:#4c6b3f; }

  /* ── 턴 종료 · 힌트 ── */
  .acts { position:absolute; right:1.4%; bottom:5%; z-index:18; display:flex;
          flex-direction:column; align-items:stretch; gap:.5em; }
  .acts button { background:#14100acc; border:1px solid var(--line2); color:var(--gold);
                 padding:.55em 1.1em; font:inherit; font-size:clamp(9px,.85vw,13px);
                 letter-spacing:.1em; cursor:pointer; }
  .acts button:hover:not(:disabled) { background:#241a0d; border-color:var(--gold); }
  .acts button:disabled { opacity:.4; cursor:default; }
  .acts .end { line-height:1.15; }
  .acts .end b { display:block; font-weight:400; font-size:1.15em; }

  /* ── 상태 배지 ── */
  .flags { position:absolute; left:1%; top:6.5%; z-index:19; width:20%;
           display:flex; flex-direction:column; gap:.3em; align-items:flex-start; }
  .flags span { background:#14100acc; border:1px solid var(--line); padding:.12em .55em;
                font-size:clamp(7px,.68vw,11px); color:#c49a6a; text-shadow:0 1px 2px #000; }
  .flags span.warn { color:#d08a78; border-color:#5a3430; }

  /* ── 비전투 화면 · 오버레이 ── */
  /* 층층이 쌓인 판이 그 아래를 막지 않게 한다.
     #body 는 전투 부품의 그릇일 뿐이고, 적은 그보다 뒤(z2)에 서 있다. */
  #body { position:absolute; inset:0; z-index:15; pointer-events:none; }
  #body > * { pointer-events:auto; }
  /* #body > * 가 특이도(1,0,0)로 이기므로 되돌릴 때도 id 를 물고 간다 */
  #body > .banner, #body > .handwrap, .hrow, .flags, .win { pointer-events:none; }
  .hc { pointer-events:auto; }
  /* 오버레이는 비어 있어도 화면 전체를 덮는다. 내용이 있을 때만 클릭을 받아야
     그 아래의 맵 노드·슬롯 노브·손패·턴 종료가 눌린다. */
  #overlay { position:absolute; inset:0; z-index:30; pointer-events:none; }
  #overlay > * { pointer-events:auto; }
  .over { position:absolute; inset:0; backdrop-filter:blur(3px);

  .cp { width:11.6cqw; cursor:pointer; text-align:center;

  .mapwrap { position:absolute; inset:0; overflow:hidden; padding:7% 3% 3%;

        display:flex; flex-direction:column; align-items:center; justify-content:center;

        transition:border-color .15s, transform .15s; }
  .mn .i { font-size:2cqw; display:block; line-height:1; }
  .mn.can:hover { transform:scale(1.18); }

  .mn.can:hover { background:#241a0d; border-color:var(--gold); }

  .mn.here { border-color:var(--gold); color:var(--gold); background:#241a0d; }

  /* ── 시스템 버튼 ── */
  .sysbtns { position:absolute; right:1%; top:6.5%; z-index:22; display:flex; gap:.35em; }

  /* ── 공연 기록 — 무대 옆 메모지. 스크롤 없이 최근 것만 보인다 ── */

  .notes.on { display:flex; }
  .notes .cap { font-size:.78cqw; color:var(--goldd); letter-spacing:.16em;
                border-bottom:1px solid var(--line); padding-bottom:.3em; margin-bottom:.35em; }
  .log { flex:1; min-height:0; overflow:hidden; font-size:.82cqw; display:block;
         line-height:1.55; color:#8a7c66; word-break:break-word; overflow-wrap:anywhere; }
  .log .t{color:var(--faint);} .log .s{color:var(--gold);} .log .d{color:#b07a6a;}
  .log .b{color:var(--blue);} .log .e{color:var(--purple);} .log .a{color:#c49a6a;}

  /* ── 도감 ── */

  .deck { display:flex; flex-wrap:wrap; gap:.3em; align-content:flex-start; }

          font-size:clamp(7px,.68vw,11px); color:var(--muted); }
  .card img { width:1.35em; height:1.35em; }
  .card b { font-weight:400; color:var(--gold); }
  .note { font-size:clamp(7px,.66vw,11px); color:var(--faint); line-height:1.6;
          margin-top:.4em; flex:none; }
  table { border-collapse:collapse; width:100%; font-size:clamp(7px,.68vw,11px); }
  td { padding:.05em 0; color:var(--muted); vertical-align:top; }
  td.n { text-align:right; color:var(--gold); white-space:nowrap; }
  .amprow td:first-child { color:#c49a6a; white-space:nowrap; padding-right:.5em; }
  .codexclose { position:absolute; right:0; top:-3.4%; background:#14100acc;
                border:1px solid var(--line2); color:var(--gold); padding:.3em 1.2em;
                font:inherit; font-size:clamp(8px,.75vw,12px); cursor:pointer; }
  .codexclose:hover { background:#241a0d; border-color:var(--gold); }

</style>

<body>

<div class="game" id="game">
  <!-- 극장 뎁스 레이어 — 합성 순서는 UI/theater/README.md 를 그대로 따른다.
       네 레이어가 같은 1672x941 캔버스라 겹치기만 하면 정합된다. -->

<!-- 캐시 무효화 — 프리뷰가 옛 engine.js/sim.js 를 붙들면 옛 규칙으로 플레이하게 된다 -->

<script>
(function () {
  var T = window.Theater, Sim = window.Sim, el = function (i) { return document.getElementById(i); };
  var S = null, pend = null, tip = null;
  var inFight = false;

  // ── UI 자산 ───────────────────────────────────────────────
  // 카드 id → UI/slots/symbols 파일명. 27종이 카드와 1:1 로 있다.
  var SYM = {
    knight:'knight', king:'king', jester:'jester', priest:'priest', dancer:'dancer',
    acrobat:'acrobat', singer:'singer', dead:'undead',
    piano:'piano', violin:'violin', drum:'drum', trumpet:'trumpet', rage:'rage-fire',
    tragedy:'tragedy-blood', cold:'frost', fear:'fear-ghost', joy:'joy-star',
    sword:'dagger', shield:'shield', rose:'rose', mirror:'mirror', chain:'chain',
    mask:'mask', candle:'candlestick', curtain:'curtain', crown:'crown', gem:'wild-diamond'
  };
  // 캐릭터 키 → UI/character 파일명 (UI/character/README.md 의 8종 순서)
  var CHR_ART = {
    director:'director', mirror:'mirror-actor', maestro:'maestro', frenzy:'frenzied-director',
    harlequin:'jester', fallen:'corrupted-director', darling:'audience-darling', closer:'final-act-actor'
  };
  // 슬롯 캔버스(1024x592) 안의 창·노브 좌표 — PNG 내용 경계 실측값
  var WIN_L = 170 / 1024 * 100, WIN_W = 168.75 / 1024 * 100;
  var KNOB_L = (240 - 40) / 1024 * 100, KNOB_SP = 180 / 1024 * 100;

  function symUrl(id) { return SYM[id] ? '../UI/slots/symbols/' + SYM[id] + '.png' : null; }
  function symMarkup(id) {
    var u = symUrl(id), d = T.CARDS[id] || {};
    return u ? '<div class="sym" style="background-image:url(' + u + ')"></div>'
             : '<div class="emo">' + (d.icon || '·') + '</div>';
  }
  function scriptBase(c) {
    var t = Math.min(3, Math.max(1, c || 1));
    return '../UI/scripts/base/runtime/script-base-cast-cost' + t + '-story-384.png';
  }
  // 요구 심볼 하나하나가 어떻게 채워졌는지 — 'have' 무대에 있다 / 'wild' 보석이 대신 선다 / 'miss' 없다
  function reqFill(sc, stage, relax) {
    var pool = [], wild = 0;
    (stage || []).forEach(function (id) { if (T.isWild(id)) wild++; else pool.push(id); });
    wild = Math.min(wild, 1);                       // 보석이 둘이어도 하나만 센다
    var slack = relax || 0;
    return (sc.requires || []).map(function (id) {
      var i = pool.indexOf(id);
      if (i >= 0) { pool.splice(i, 1); return 'have'; }
      if (wild > 0) { wild--; return 'wild'; }
      if (slack > 0) { slack--; return 'slack'; }
      return 'miss';
    });
  }

  function reqMarkup(sc, stage, relax) {
    if (sc.requiresFam) return '<em>' + (T.FAM_KO[sc.requiresFam] || '') + ' 계열</em>';
    var fill = reqFill(sc, stage, relax);
    return (sc.requires || []).map(function (id, i) {
      var u = symUrl(id), st = fill[i];
      var t = st === 'wild' ? ' — 💎 보석이 대신 선다'
            : st === 'slack' ? ' — 🎭 대역 배우가 이 요구를 무시한다'
            : st === 'miss' ? ' — 무대에 없다' : ' — 무대에 있다';
      var body = u ? '<span class="rq ' + st + '" style="background-image:url(' + u + ')"'
                     + ' title="' + (T.CARDS[id] || {}).name + t + '"></span>'
                   : '<em class="rq ' + st + '">' + ((T.CARDS[id] || {}).icon || '?') + '</em>';
      return body;
    }).join('');
  }
  function cardIcon(id) {
    var u = symUrl(id);
    return u ? '<img src="' + u + '" alt="">' : ((T.CARDS[id] || {}).icon || '·');
  }
  var NI = { fight:'⚔️', elite:'💀', shop:'🏪', rest:'🕯️', forge:'⚒️', event:'❓', boss:'👹' };
  var NK = Sim.NK;

  // 해금은 이 화면 안에서만 기억한다 — 실제 게임에서는 저장된다
  var UNLOCKED = {};
  Object.keys(T.CHARS).forEach(function (k) { if (T.CHARS[k].start) UNLOCKED[k] = 1; });
  try {
    var saved = JSON.parse(localStorage.getItem('tlt_unlock') || '{}');
    Object.keys(saved).forEach(function (k) { UNLOCKED[k] = 1; });
  } catch (e) {}
  function unlock(k) {
    if (UNLOCKED[k]) return;
    UNLOCKED[k] = 1;
    try { localStorage.setItem('tlt_unlock', JSON.stringify(UNLOCKED)); } catch (e) {}
  }

  // 무엇을 깼는가 — 난이도와 재연은 깬 만큼만 열린다 (69장).
  // 지금까지는 첫 화면에서 어려움도 재연 8단도 바로 고를 수 있었다.
  //   { story:1, normal:1, hard:1, asc:N }   asc 는 넘긴 최고 재연 단수
  var CLEAR = { asc: 0 };
  try { CLEAR = Object.assign(CLEAR, JSON.parse(localStorage.getItem('tlt_clear') || '{}')); } catch (e) {}
  function saveClear() { try { localStorage.setItem('tlt_clear', JSON.stringify(CLEAR)); } catch (e) {} }
  // 3막을 넘긴 그 순간에 기록한다
  function noteClear(diffKey, ascLv) {
    CLEAR[diffKey] = 1;
    if (diffKey === 'hard' && ascLv >= CLEAR.asc) CLEAR.asc = ascLv + 1;   // 다음 단이 열린다
    saveClear();
  }
  function diffOpen(k) {
    if (k === 'story' || k === 'normal') return true;
    if (k === 'hard') return !!CLEAR.normal;      // 보통을 넘겨야 어려움이 열린다
    return false;
  }
  // 재연은 어려움을 넘긴 뒤부터. 그다음은 한 단씩.
  function ascMax() { return CLEAR.hard ? Math.min(T.ASCENSION.length, CLEAR.asc) : 0; }

  // ── 타이틀 ────────────────────────────────────────────────
  function showTitle() {
    inFight = false;
    S = null; render();
    var o = ov();
    o.innerHTML = '<h3>대역 — UNDERSTUDY</h3>'
      + '<div class="sub">슬롯이 <b>배역</b>을 무대에 올린다. 준비한 <b>대본</b>은 요구 배역이 무대에 있을 때 상연된다.<br>'
      + '상태이상은 피해를 <b>곱한다</b> — 먼저 걸고 그다음 터뜨린다.<br>'
      + '<span style="color:#56545e">처음에는 두 명만 열려 있다. 나머지는 그 캐릭터의 승리 조건을 한 번 해내면 열린다.</span></div>';
    var d = document.createElement('div'); d.className = 'chars';
    Object.keys(T.CHARS).forEach(function (k) {
      var c = T.CHARS[k], open = !!UNLOCKED[k], n = document.createElement('div');
      n.className = 'chr' + (open ? '' : ' lock');
      n.innerHTML = '<div class="n">' + (open ? c.name : '🔒 ' + c.name) + '</div>'
        + '<div class="m">' + T.WIN_KO[c.win] + ' · 최대 코스트 ' + c.maxCost + '</div>'
        + '<div class="d">' + c.note + '<br>'
        + Object.keys(c.deck).map(function (id) { return T.CARDS[id].icon + c.deck[id]; }).join(' ') + '</div>'
        + (open ? '' : '<div class="u">해금 — ' + (c.unlock || '') + '</div>');
      if (open) n.onclick = function () { pickDiff(k); };
      d.appendChild(n);
    });
    o.appendChild(d);
  }

  // ── 난이도 — 「무엇을 하러 왔는가」를 묻는 자리 ─────────────
  function pickDiff(ck) {
    var o = ov();
    o.innerHTML = '<h3>' + T.CHARS[ck].name + '</h3>'
      + '<div class="sub">이 판에서 무엇을 원하는지 고른다.'
      + (CLEAR.normal ? '' : '<br><span style="color:#56545e">3막을 넘기면 다음 자리가 열린다.</span>') + '</div>';
    var d = document.createElement('div'); d.className = 'chars';
    var GATE = { hard: '보통에서 3막을 넘긴다' };
    Object.keys(T.DIFFICULTY).forEach(function (k) {
      var f = T.DIFFICULTY[k], open = diffOpen(k), n = document.createElement('div');
      n.className = 'chr' + (open ? '' : ' lock'); n.style.width = '210px';
      n.innerHTML = '<div class="n">' + (open ? '' : '🔒 ') + f.name + (CLEAR[k] ? ' ✓' : '') + '</div>'
        + '<div class="m">' + f.note + '</div>'
        + '<div class="d">' + f.sub + '<br><span style="color:#56545e">적 HP ×' + f.hpMul + ' · 공격 ×' + f.atkMul + '</span></div>'
        + (open ? '' : '<div class="u">해금 — ' + (GATE[k] || '') + '</div>');
      if (open) n.onclick = function () { k === 'hard' ? pickAsc(ck) : startRun(ck, k, 0); };
      d.appendChild(n);
    });
    o.appendChild(d);
    var b = document.createElement('button'); b.textContent = '뒤로';
    b.onclick = showTitle; o.appendChild(b);
  }

  function pickAsc(ck) {
    var o = ov();
    o.innerHTML = '<h3>저주받은 대본</h3>'
      + '<div class="sub">재연은 수치를 올리지 않는다. 규칙을 하나씩 더한다.</div>';
    var d = document.createElement('div'); d.className = 'cardpick';
    // 재연은 한 단씩 열린다 — 그 단으로 3막을 넘겨야 다음 단이 나온다 (69장)
    var top = ascMax();
    [0].concat(T.ASCENSION.map(function (a) { return a.n; })).forEach(function (lv) {
      if (lv > top) return;
      var a = lv ? T.ASCENSION[lv - 1] : null, n = document.createElement('div');
      n.className = 'cp'; n.style.width = '186px';
      n.innerHTML = '<div class="n">' + (lv ? a.icon + ' ' + lv + '단 — ' + a.name : '재연 없음') + '</div>'
        + '<div class="e">' + (lv ? a.desc : '어려움 그대로') + '</div>'
        + (lv > 1 ? '<div class="x">' + (lv - 1) + '단까지 전부 포함</div>' : '');
      n.onclick = function () { startRun(ck, 'hard', lv); };
      d.appendChild(n);
    });
    if (top < T.ASCENSION.length) {
      var more = document.createElement('div'); more.className = 'sub';
      more.style.marginTop = '10px';
      more.innerHTML = top === 0
        ? '어려움에서 3막을 넘기면 <b>재연 1단</b>이 열린다.'
        : '재연 ' + top + '단으로 3막을 넘기면 <b>' + (top + 1) + '단</b>이 열린다.';
      d.appendChild(more);
    }
    o.appendChild(d);
    var b = document.createElement('button'); b.textContent = '뒤로';
    b.onclick = function () { pickDiff(ck); }; o.appendChild(b);
  }

  function startRun(ck, dk, asc) {
    S = Sim.newRun({ charKey: ck, diffKey: dk, asc: asc,
                     seed: (Date.now() & 0x7fffffff) | 1 });
    clearOv(); showMap();
  }

  // ── 맵 ────────────────────────────────────────────────────
  function showMap() {
    inFight = false;
    pend = null; tip = null;
    var b = el('body');
    b.innerHTML = '<div class="mapwrap"><div class="maphead" id="mh"></div>'
      + '<div class="maprail" id="mw"></div></div>';
    var w = el('mw');
    // 좌 → 우 수평, 중앙 정렬 (DESIGN 17). 층이 열이고 갈래가 세로다.
    // 한 화면에 한 막만 건다 — 36층을 한 줄에 밀면 레일을 넘쳐 양끝이 잘린다.
    // 창을 「지금 막」이 아니라 「다음에 갈 층」으로 잡는다.
    // S.act 는 13층에 들어가야 2가 되는데 12층 보스를 깬 시점에는 아직 1이다.
    // 그래서 화면이 1~12층만 그리고 13층 노드가 렌더링되지 않아 클릭할 칸이 없었다.
    var per = Math.max(1, Math.round(T.CFG.floors / 3));
    var nf = S.at ? S.at.f + 1 : 0;
    var lo = Math.min(Math.floor(nf / per) * per, Math.max(0, S.map.length - per));
    var hi = Math.min(S.map.length, lo + per);
    var dact = Math.min(3, Math.floor(lo / per) + 1);
    S.map.slice(lo, hi).forEach(function (row, ri) {
      var fi = lo + ri;
      var fl = document.createElement('div'); fl.className = 'floor';
      row.forEach(function (nd) {
        var d = document.createElement('div');
        var here = S.at && S.at.f === nd.f && S.at.c === nd.c;
        var can = Sim.reachable(S, nd.f, nd.c);
        d.className = 'mn' + (here ? ' here' : (S.cleared[nd.f + ',' + nd.c] ? ' done' : (can ? ' can' : '')));
        d.innerHTML = '<span class="i">' + NI[nd.type] + '</span>' + NK[nd.type];
        d.title = (fi + 1) + '층 · ' + NK[nd.type];
        if (can) d.onclick = function () { enter(nd); };
        fl.appendChild(d);
      });
      w.appendChild(fl);
    });
    el('mh').innerHTML = '제' + dact + '막 — ' + (lo + 1) + '~' + hi + '층'
      + ' <span>다음 무대를 고른다</span>';
    render();
  }

  function enter(nd) {
    Sim.goTo(S, nd);
    if (nd.type === 'shop') return showShop();
    if (nd.type === 'rest') return showRest();
    if (nd.type === 'forge') return showForge();
    if (nd.type === 'event') return showEvent();
    Sim.openFight(S, nd);
    clearOv(); nextTurn();
  }

  // ── 전투 ──────────────────────────────────────────────────
  function nextTurn() {
    Sim.beginTurn(S);
    pend = null; tip = null;
    drawFight();
  }

  // ── 연출 — 무슨 일이 일어났는지 무대 위에서 보여준다 ────────
  //
  // 피해는 지금까지 로그 패널의 글자로만 나갔다. 때린 것도 맞은 것도 화면에서
  // 아무 일이 없으니 「막 눌러도 되는」 게임처럼 보인다.
  //
  // drawFight 는 매번 innerHTML 을 새로 쓴다 — 그래서 뜨는 숫자를 DOM 에 직접
  // 꽂으면 다음 렌더에 지워진다. 큐에 쌓아두고 렌더 끝에서 함께 그린다.
  var fx = { foe: {}, me: 0, meKind: '' };

  function snap() {
    return { me: S.hp, blk: S.block || 0, foes: S.foes.map(function (f) { return f.hp; }) };
  }
  // 스냅과 지금을 비교해 변화량을 큐에 넣는다
  function diffFx(b) {
    if (!b) return;
    S.foes.forEach(function (f, i) {
      var d = Math.round((b.foes[i] == null ? f.hp : b.foes[i]) - f.hp);
      if (d > 0) fx.foe[i] = (fx.foe[i] || 0) + d;
    });
    var md = Math.round(b.me - S.hp);
    if (md > 0) { fx.me += md; fx.meKind = 'dmg'; }
    else if (md < 0) { fx.me += md; fx.meKind = 'heal'; }
  }
  // 큐를 무대에 그린다. drawFight 끝에서 호출한다.
  function flushFx() {
    var st = el('stage');
    Object.keys(fx.foe).forEach(function (i) {
      var d = fx.foe[i], host = st.children[i];
      if (!host || !d) return;
      host.classList.add('hit');
      var n = document.createElement('div');
      n.className = 'flt dmg' + (d >= 30 ? ' big' : '');
      n.textContent = '-' + d;
      host.appendChild(n);
      setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 1000);
    });
    if (fx.me) {
      var g = el('game');
      if (fx.me > 0) {
        g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
        var h = el('hurt'); h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
      }
      var t = el('tHp');
      if (t && t.parentNode) {
        var m = document.createElement('div');
        m.className = 'flt ' + (fx.me > 0 ? 'dmg' : 'heal');
        m.textContent = (fx.me > 0 ? '-' : '+') + Math.abs(fx.me);
        m.style.top = '-10%';
        t.parentNode.style.position = 'relative';
        t.parentNode.appendChild(m);
        setTimeout(function () { if (m.parentNode) m.parentNode.removeChild(m); }, 1000);
      }
    }
    fx = { foe: {}, me: 0, meKind: '' };
  }
  // 막이 내린다 — 전투가 끝날 때 한 번
  function curtainCall(txt) {
    var c = el('curtain');
    c.firstChild.textContent = txt;
    c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
  }

  function endTurn() {
    var b = snap();
    var r = Sim.finishTurn(S);
    diffFx(b);
    if (r === 'won') { curtainCall('막이 내린다'); return setTimeout(afterWin, 620); }
    if (r === 'dead') return endRun(false);
    nextTurn();
  }

  // ── 드래그 앤 드롭 — 대본을 끌어다 적 위에 놓는다 ─────────
  //
  // 클릭으로 고르고 다시 적을 클릭하는 방식은 남긴다. 둘 다 되는 편이 낫다.
  var drag = null;   // { sc, ghost, needTarget, x0, y0 }

  function needsTarget(sc) { return T.scriptEffect(sc, S.ch).dmg > 0; }

  function dragStart(ev, sc, card) {
    if (!Sim.canPlay(S, sc)) return;
    ev.preventDefault();
    var g = card.cloneNode(true);
    g.id = 'ghost'; g.className = 'hc'; g.style.width = card.offsetWidth + 'px';
    g.style.height = card.offsetHeight + 'px';
    document.body.appendChild(g);
    drag = { sc: sc, ghost: g, card: card, need: needsTarget(sc),
             x0: ev.clientX, y0: ev.clientY, moved: false };
    card.classList.add('dragging');
    dragMove(ev);
    window.addEventListener('pointermove', dragMove);
    window.addEventListener('pointerup', dragEnd);
  }

  function foeUnder(x, y) {
    var hit = null;
    document.querySelectorAll('#stage .foe').forEach(function (d, i) {
      if (S.foes[i] && S.foes[i].hp <= 0) return;
      var r = d.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = { el: d, i: i };
    });
    return hit;
  }

  function dragMove(ev) {
    if (!drag) return;
    if (Math.abs(ev.clientX - drag.x0) + Math.abs(ev.clientY - drag.y0) > 6) drag.moved = true;
    drag.ghost.style.left = ev.clientX + 'px';
    drag.ghost.style.top = ev.clientY + 'px';
    var over = drag.need ? foeUnder(ev.clientX, ev.clientY) : null;
    document.querySelectorAll('#stage .foe').forEach(function (d) { d.classList.remove('over'); });
    if (over) over.el.classList.add('over');
    // 카드에서 대상까지 실을 그어준다 — 어디로 가는지 보이게
    var path = document.querySelector('#dragline path');
    if (!path) return;
    if (!drag.need) { path.setAttribute('d', ''); return; }
    var r = drag.card.getBoundingClientRect();
    var sx = r.left + r.width / 2, sy = r.top;
    var mx = (sx + ev.clientX) / 2, my = Math.min(sy, ev.clientY) - 60;
    path.setAttribute('d', 'M' + sx + ',' + sy + ' Q' + mx + ',' + my + ' ' + ev.clientX + ',' + ev.clientY);
  }

  function dragEnd(ev) {
    window.removeEventListener('pointermove', dragMove);
    window.removeEventListener('pointerup', dragEnd);
    if (!drag) return;
    var d = drag; drag = null;
    if (d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    d.card.classList.remove('dragging');
    var path = document.querySelector('#dragline path'); if (path) path.setAttribute('d', '');
    document.querySelectorAll('#stage .foe').forEach(function (x) { x.classList.remove('over'); });
    if (!d.moved) return clickScript(d.sc);          // 그냥 누른 것이면 예전처럼 조준 모드
    if (!d.need) return fire(d.sc, -1);              // 대상이 없는 대본은 어디에 놓아도 된다
    var over = foeUnder(ev.clientX, ev.clientY);
    if (over) fire(d.sc, over.i);
    else drawFight();                                // 허공에 놓으면 취소
  }

  function clickScript(sc) {
    if (!Sim.canPlay(S, sc)) return;
    if (T.scriptEffect(sc, S.ch).dmg <= 0) return fire(sc, -1);
    pend = (pend === sc) ? null : sc;
    drawFight();
  }
  function clickFoe(i) {
    if (!pend || S.foes[i].hp <= 0) return;
    var sc = pend; pend = null; fire(sc, i);
  }
  // 해금 조건 관찰은 sim.js 가 한다 — 규칙을 두 곳에 두지 않는다
  function fire(sc, tgt) {
    var b = snap();
    Sim.playScript(S, sc, tgt);
    diffFx(b);
    if (S.over === 'dead') return endRun(false);
    if (S.over === 'won') { drawFight(); curtainCall('막이 내린다'); return setTimeout(afterWin, 620); }
    drawFight();
  }

  function toggleLock(k) {
    if (Sim.toggleLock(S, k)) drawFight();          // 잠금은 무료다
  }
  function doRespin() {
    if (Sim.doRespin(S)) { pend = null; tip = null; drawFight(); }
  }

  function showTip() {
    var p = Sim.suggest(S);
    tip = p.seq.length ? p.seq[0].sc : null;
    drawFight();
  }

  // ── 보상 — 배역이냐 대본이냐 ──────────────────────────────
  function afterWin() {
    Object.keys(S.feat).forEach(unlock);
    // 보스가 막마다 있다 — 마지막 막의 보스만 런을 끝낸다
    if (S.at.type === 'boss') {
      if (S.at.f >= T.CFG.floors - 1) return endRun(true);
      return rewardBoss();
    }
    if (S.at.type === 'elite') return rewardScript('비극을 넘겼다 — 대본을 하나 고른다');
    if (S.bonusScript) { S.bonusScript = 0; return rewardScript('난입자를 이겨냈다 — 대본을 하나 고른다'); }
    rewardBoth();
  }

  function cardBox(id, extra) {
    var d = T.CARDS[id];
    return '<div class="ic">' + cardIcon(id) + '</div><div class="n">' + d.name + '</div>'
      + '<div class="e">' + T.FAM_KO[d.fam] + ' · ' + T.cardText(d) + '</div>'
      + '<div class="x">릴에 ' + (S.deck[id] || 0) + '장' + (extra ? '<br>' + extra : '') + '</div>';
  }
  function scriptBox(sc, extra) {

      + '<div class="e">' + T.TIER_KO[sc.tier] + ' · 코스트 ' + Sim.costOf(S.ch, sc)
      + (Sim.costOf(S.ch, sc) > sc.cost ? ' <span style="color:#b07a6a">(계열 밖)</span>' : '') + '<br>'
      + '요구 ' + T.reqText(sc) + '<br>' + T.effText(sc.effect) + '</div>'
      + '<div class="x">상연 확률 ' + Math.round(p * 100) + '%' + (extra ? '<br>' + extra : '') + '</div>';
  }

  function rewardBoth() {
    var o = ov();
    o.innerHTML = '<h3>하나만 고른다</h3>'
      + '<div class="sub"><b>배역</b>은 릴에 들어가 상연 확률을 올린다. <b>대본</b>은 할 수 있는 일을 늘린다.<br>'
      + '릴 ' + Sim.deckSize(S) + '/' + T.CFG.reelMax + ' · 대본 ' + S.scripts.length + '/' + Sim.scriptCap(S) + '</div>';
    var t1 = document.createElement('div'); t1.className = 'sub'; t1.textContent = '배역';
    o.appendChild(t1);
    var r1 = document.createElement('div'); r1.className = 'cardpick';
    Sim.offerCards(S).forEach(function (id) {

      d.innerHTML = cardBox(id, full ? '릴이 꽉 찼다' : '');

      r1.appendChild(d);

    o.appendChild(r1);
    var t2 = document.createElement('div'); t2.className = 'sub'; t2.textContent = '대본';
    o.appendChild(t2);
    var r2 = document.createElement('div'); r2.className = 'cardpick';
    Sim.offerScripts(S, 3).forEach(function (sc) {
      var full = S.scripts.length >= Sim.scriptCap(S);
      var d = document.createElement('div'); d.className = 'cp' + (full ? ' dis' : '');
      d.innerHTML = scriptBox(sc, full ? '보유 상한' : '');

      r2.appendChild(d);

    o.appendChild(r2);

    o.appendChild(b); render();
  }

  // 막 보스를 넘기면 대본과 유물을 함께 준다 — 막의 끝이 보상으로 표시되어야 한다
  function rewardBoss() {
    var o = ov();
    o.innerHTML = '<h3>🏆 제' + S.act + '막을 넘겼다</h3>'
      + '<div class="sub">대본 하나와 유물 하나를 가져간다. 다음 막이 열린다.</div>';
    var picked = { sc: false, rl: false };
    var done = function () {

    };
    var t1 = document.createElement('div'); t1.className = 'sub'; t1.textContent = '대본';
    o.appendChild(t1);
    var r1 = document.createElement('div'); r1.className = 'cardpick';
    Sim.offerScripts(S, 3).forEach(function (sc) {
      var d = document.createElement('div'); d.className = 'cp';
      d.innerHTML = scriptBox(sc);
      d.onclick = function () {
        if (picked.sc) return;
        if (S.scripts.length < Sim.scriptCap(S)) S.scripts.push(sc);
        picked.sc = true; r1.style.opacity = .4; done();
      };
      r1.appendChild(d);
    });
    o.appendChild(r1);
    var t2 = document.createElement('div'); t2.className = 'sub'; t2.textContent = '유물';
    o.appendChild(t2);
    var r2 = document.createElement('div'); r2.className = 'cardpick';
    T.pickWeighted(Object.keys(T.RELICS).filter(function (k) {
      var r = T.RELICS[k]; return !r.dark || (S.asc.level || 0) >= r.asc;
    }), function (k) { return T.RELICS[k].dark ? 1.8 : 1; }, S.rnd, 2).forEach(function (k) {
      var r = T.RELICS[k];
      var d = document.createElement('div'); d.className = 'cp';
      d.innerHTML = '<div class="ic">' + r.icon + '</div><div class="n">' + r.name
        + (r.dark ? ' <span style="color:#8b7aa8">어둠</span>' : '') + '</div>'
        + '<div class="e">' + r.desc + '</div>';
      d.onclick = function () {
        if (picked.rl) return;
        Sim.takeRelic(S, k); picked.rl = true; r2.style.opacity = .4; render(); done();
      };
      r2.appendChild(d);
    });
    o.appendChild(r2);
    render();
  }

  function rewardScript(title) {
    var o = ov();
    o.innerHTML = '<h3>' + title + '</h3>'
      + '<div class="sub">대본은 런 전체를 따라온다. 보유 ' + S.scripts.length + '/' + Sim.scriptCap(S) + '</div>';
    var row = document.createElement('div'); row.className = 'cardpick';
    Sim.offerScripts(S, 3).forEach(function (sc) {
      var full = S.scripts.length >= Sim.scriptCap(S);
      var d = document.createElement('div'); d.className = 'cp' + (full ? ' dis' : '');
      d.innerHTML = scriptBox(sc, full ? '보유 상한' : '');
      if (!full) d.onclick = function () { S.scripts.push(sc); Sim.drift(S); clearOv(); showMap(); };
      row.appendChild(d);
    });
    o.appendChild(row);
    var b = document.createElement('button'); b.textContent = '넘긴다';
    b.onclick = function () { clearOv(); showMap(); };
    o.appendChild(b); render();
  }

  // ── 상점 ──────────────────────────────────────────────────
  function showShop() {
    if (!S.stock) {
      S.stock = {
        cards: Sim.offerCards(S).map(function (id) { return { id: id, cost: 8 + Math.floor(S.rnd() * 6) }; }),
        scripts: Sim.offerScripts(S, 3).map(function (sc) { return { sc: sc, cost: 16 + sc.cost * 5 }; }),
        // 어둠 유물은 재연 단계로 열린다
        relics: T.pickWeighted(Object.keys(T.RELICS).filter(function (k) {
          var r = T.RELICS[k]; return !r.dark || (S.asc.level || 0) >= r.asc;
        }), function (k) { return T.RELICS[k].dark ? 1.8 : 1; }, S.rnd, 2)
          .map(function (k) { return { k: k, cost: T.RELICS[k].cost }; })
      };
    }
    var o = ov();
    o.innerHTML = '<h3>소품실 — 골드 ' + S.gold + '</h3>'
      + '<div class="sub">칸이 유한하다. 무엇을 뺄지가 결정이다.</div>';
    var mk = function (label, items, draw, buy) {
      var t = document.createElement('div'); t.className = 'sub'; t.textContent = label;
      o.appendChild(t);
      var row = document.createElement('div'); row.className = 'cardpick';
      items.forEach(function (it, i) {
        var poor = S.gold < it.cost;
        var d = document.createElement('div'); d.className = 'cp' + (poor ? ' dis' : '');
        d.innerHTML = draw(it);
        if (!poor) d.onclick = function () { S.gold -= it.cost; buy(it); items.splice(i, 1); Sim.drift(S); showShop(); };
        row.appendChild(d);
      });
      o.appendChild(row);
    };
    mk('배역', S.stock.cards, function (it) { return cardBox(it.id, it.cost + ' 골드'); },
       function (it) { if (Sim.deckSize(S) < T.CFG.reelMax) S.deck[it.id] = (S.deck[it.id] || 0) + 1; });
    mk('대본', S.stock.scripts, function (it) { return scriptBox(it.sc, it.cost + ' 골드'); },
       function (it) { if (S.scripts.length < Sim.scriptCap(S)) S.scripts.push(it.sc); });
    mk('유물', S.stock.relics, function (it) {
      var r = T.RELICS[it.k];
      return '<div class="ic">' + r.icon + '</div>'
        + '<div class="n">' + r.name
        + (r.dark ? ' <span style="color:#8b7aa8">어둠</span>' : '') + '</div>'
        + '<div class="e">' + r.desc + '</div><div class="x">' + it.cost + ' 골드</div>';
    }, function (it) { Sim.takeRelic(S, it.k); });

    // 릴 판매 — 좁히면 확률이 오르고 자금도 생긴다. 상점마다 상한이 있다.
    var G = T.CFG.gold;
    S.sold = S.sold || 0;
    var sellCap = S.sold >= G.sellMax, floorCap = Sim.deckSize(S) <= G.reelMin;
    var t3 = document.createElement('div'); t3.className = 'sub';
    t3.textContent = '릴을 판다 — 장당 +' + G.sell + ' 골드 · 이 상점에서 ' + S.sold + '/' + G.sellMax
      + (floorCap ? ' · 릴 최소 ' + G.reelMin + '칸' : '');
    o.appendChild(t3);
    var rem = document.createElement('div'); rem.className = 'cardpick';
    Object.keys(S.deck).sort().forEach(function (id) {
      var b = document.createElement('button');
      b.textContent = T.CARDS[id].icon + ' ' + T.CARDS[id].name + ' 팔기 (+' + G.sell + ')';
      b.disabled = sellCap || floorCap;
      b.onclick = function () {
        S.deck[id]--; if (!S.deck[id]) delete S.deck[id];
        S.gold += G.sell; S.sold++; showShop();
      };
      rem.appendChild(b);
    });
    o.appendChild(rem);
    var go = document.createElement('button'); go.className = 'go'; go.textContent = '나간다';
    go.onclick = function () { S.stock = null; S.sold = 0; clearOv(); showMap(); };
    o.appendChild(go); render();
  }

  function showRest() {
    var o = ov();
    o.innerHTML = '<h3>분장실</h3><div class="sub">HP ' + Math.round(S.hp) + '/' + S.maxHp + '</div>';
    var row = document.createElement('div'); row.className = 'cardpick';
    [['HP 35% 회복', function () { S.hp = Math.min(S.maxHp, S.hp + S.maxHp * 0.35); }],
     ['최대 HP +10', function () { S.maxHp += 10; S.hp += 10; }]].forEach(function (p) {
      var d = document.createElement('div'); d.className = 'cp';
      d.innerHTML = '<div class="n">' + p[0] + '</div>';
      d.onclick = function () { p[1](); clearOv(); showMap(); };
      row.appendChild(d);
    });
    o.appendChild(row); render();
  }

  // ── 사건 ──────────────────────────────────────────────────
  // 전투도 상점도 아닌 칸. 대가를 내고 무언가를 바꾼다.
  function showEvent() {
    if (!S.ev) S.ev = T.EVENTS[Math.floor(S.rnd() * T.EVENTS.length)];
    var ev = S.ev, o = ov();
    o.innerHTML = '<h3>' + ev.icon + ' ' + ev.name + '</h3>'
      + '<div class="sub">' + ev.text + '</div>';
    var row = document.createElement('div'); row.className = 'cardpick';
    ev.opts.forEach(function (op) {
      var d = document.createElement('div'); d.className = 'cp'; d.style.width = '224px';
      d.innerHTML = '<div class="n">' + op[0] + '</div>';
      d.onclick = function () {
        if (op[1] !== 'none') Sim.applyEvent(S, S.w, op[1]);
        S.ev = null; Sim.drift(S); clearOv(); showMap();
      };
      row.appendChild(d);
    });
    o.appendChild(row); render();
  }

  function showForge() {
    var o = ov();
    o.innerHTML = '<h3>각색실</h3>'
      + '<div class="sub">같은 배역 2장을 1장으로 압축한다. 칸이 비고 남은 배역의 확률이 오른다.</div>';
    var row = document.createElement('div'); row.className = 'cardpick';
    Object.keys(S.deck).filter(function (id) { return S.deck[id] >= 2; }).forEach(function (id) {
      var d = document.createElement('div'); d.className = 'cp';
      d.innerHTML = cardBox(id, '2장 → 1장');
      d.onclick = function () { S.deck[id]--; clearOv(); showMap(); };
      row.appendChild(d);
    });
    o.appendChild(row);
    var b = document.createElement('button'); b.textContent = '나간다';
    b.onclick = function () { clearOv(); showMap(); };
    o.appendChild(b); render();
  }

  function endRun(won) {
    S.over = won ? 'won' : 'dead';
    Object.keys(S.feat).forEach(unlock);
    // 다음 자리는 여기서 열린다 — 3막을 넘긴 그 판이 열쇠다
    var opened = null;
    if (won) {
      var before = { hard: diffOpen('hard'), asc: ascMax() };
      noteClear(S.diffKey, S.asc.level || 0);
      if (!before.hard && diffOpen('hard')) opened = '어려움';
      else if (ascMax() > before.asc) opened = '재연 ' + ascMax() + '단';
    }
    var o = ov();
    var newly = Object.keys(S.feat).filter(function (k) { return T.CHARS[k]; })
      .map(function (k) { return T.CHARS[k].name; });
    o.innerHTML = '<h3>' + (won ? '막을 끝냈다' : '막이 내렸다') + '</h3>'
      + '<div class="sub">' + (won ? 'HP ' + Math.round(S.hp) + '/' + S.maxHp
        : (S.at ? (S.at.f + 1) + '층 · ' + (S.killedBy || (S.foes && S.foes[0] ? S.foes[0].name : '')) + ' 에게 무너졌다' : ''))
      + (newly.length ? '<br><span style="color:#a8c49a">해금 — ' + newly.join(' · ') + '</span>' : '')
      + (opened ? '<br><span style="color:#d2a848">🔓 ' + opened + ' 이 열렸다</span>' : '')
      + '</div>';
    var b = document.createElement('button'); b.className = 'go'; b.textContent = '처음으로';
    b.onclick = showTitle; o.appendChild(b); render();
  }

  function ov() { var o = el('overlay'); o.innerHTML = '<div class="over"></div>'; return o.firstChild; }
  function clearOv() { el('overlay').innerHTML = ''; }

  // ── 전투 화면 ─────────────────────────────────────────────
  // 다음 행동을 사람 말로 — 아이콘과 숫자만으로는 무엇이 오는지 모른다
  var INTENT_ICON = { atk: '⚔', def: '🛡', buff: '💪', heal: '💚', absorb: '🌀' };
  function intentLine(f) {
    var info = T.intentInfo(f, f.next);
    var ic = INTENT_ICON[info.kind] || '⚔';
    var when = f.t > 0 ? ' <span style="opacity:.65">' + f.t + '턴 뒤</span>' : '';
    return ic + ' ' + info.ko + (info.n ? ' ' + info.n : '') + when;
  }

  function drawFight() {
    inFight = true;
    var ctx = Sim.ctxOf(S, S.w);
    var b = el('body');
    b.innerHTML = '<div class="slotwrap" id="slotwrap"></div>'
      + '<div class="banner" id="banner"></div>'
      + '<div class="handwrap" id="hw"></div>'
      + '<div class="acts" id="acts"></div>';

    // ── 무대 위의 적 ─────────────────────────────────────────
    // 적 전용 아트는 아직 없다 (DESIGN 80.7 — 아트 16장 미착수).
    // 그때까지는 인형극 실루엣 판으로 세우고, 자리와 정보 구조는 레퍼런스대로 둔다.
    var st = el('stage');
    st.innerHTML = '';
    S.foes.forEach(function (f, i) {
      var d = document.createElement('div');
      d.className = 'foe' + (pend && f.hp > 0 ? ' aim' : '') + (f.hp <= 0 ? ' dead' : '');
      var amp = T.ampMul(f, {}), ampAoe = T.ampMul(f, { aoe: true }), at = [];
      if (amp > 1) at.push('받는 피해 +' + Math.round((amp - 1) * 100) + '%');
      if (ampAoe > amp) at.push('광역 ×' + (ampAoe / amp).toFixed(1));
      var tags = [];
      if (f.def) tags.push('방어력 ' + f.def + (f.defGrow ? ' (+' + f.defGrow + '/턴, 최대 ' + f.defMax + ')' : ''));
      if (f.slowN) tags.push('🐌 둔화 ' + f.slowN);
      if (f.burn) tags.push('🔥 화상 ' + f.burn);
      if (f.poison) tags.push('🩸 독 ' + f.poison + (f.poison >= T.AMP.poisonLock ? ' (잠김)' : ''));
      if (f.evadeSingle) tags.push('단일 ' + Math.round(f.evadeSingle * 100) + '% 회피');
      if (f.dodgeAoe) tags.push('광역 ' + Math.round(f.dodgeAoe * 100) + '% 흘림');
      if (f.hides) tags.push('👤 후열 — 앞을 먼저');
      if (f.doom) tags.push('🔔 ' + f.doom + '턴');
      if (f.dotImmune) tags.push('화상·독 면역');
      if (f.role === 'guard') tags.push('💡 본체를 지킨다');
      if (f.guardMul && S.foes.some(function (y) { return y.hp > 0 && y.role === 'guard'; }))
        tags.push('받는 피해 ' + Math.round(f.guardMul * 100) + '% — 조명을 먼저');
      if (f.gimmick && T.GIMMICK_TEXT[f.gimmick]) tags.push(T.GIMMICK_TEXT[f.gimmick][0]
        + (f.gimT ? ' ' + f.gimT + '턴' : ''));
      if (f.seizeCd) tags.push('📜 압수 ' + (f.seizeT || f.seizeCd) + '턴');

      d.innerHTML = '<div class="nm">' + f.name + (f.boss ? ' 👑' : (f.elite ? ' 💀' : '')) + '</div>'
        + '<div class="it">' + (f.hp > 0 ? intentLine(f) : '퇴장') + '</div>'
        + '<div class="body"><div class="glyph">' + (f.boss ? '👑' : f.elite ? '💀' : '🎭') + '</div></div>'
        + '<div class="hpb"><i style="width:' + Math.max(0, f.hp / f.maxHp * 100) + '%"></i></div>'
        + '<div class="num">' + Math.max(0, Math.round(f.hp)) + ' / ' + f.maxHp + '</div>'
        + (f.block ? '<div class="blb"><i style="width:' + Math.min(100, f.block / f.maxHp * 100) + '%"></i></div>'
            + '<div class="num">방어 ' + Math.round(f.block) + '</div>' : '')
        + '<div class="amp">' + at.join(' · ') + '</div>'
        + '<div class="tag">' + tags.join('<br>') + '</div>';
      d.onclick = function () { clickFoe(i); };
      st.appendChild(d);
    });

    // ── 슬롯 ────────────────────────────────────────────────
    // 하우징은 항상 4칸이다. 활성 칸만 릴이 돌고 나머지는 커튼 셔터로 닫는다 (DESIGN 59.1).
    var N = Math.min(T.CFG.stageMax, S.slotMax || T.CFG.stageBase);
    var sw = el('slotwrap');
    var html = '<img class="sl" src="../UI/slots/slot-reel-repeat-strip.png" alt="" style="display:none">';
    for (var k = 0; k < T.CFG.stageMax; k++) {
      var live = k < N;
      var id = live ? S.stage[k] : null;
      var dd = (id && T.CARDS[id]) || {};
      var left = WIN_L + WIN_W * k;
      html += '<div class="win' + (live ? '' : ' shut') + (id === 'void' ? ' void' : '')
        + '" style="left:' + left.toFixed(3) + '%"'
        + (live ? ' title="' + (dd.name || '') + ' — '
              + (T.isWild(id) ? '어떤 배역으로도 선다. 모자란 요구 하나를 대신 채운다 (보석이 둘이어도 하나만 센다)'
                              : T.cardText(dd)) + '"'
            : ' title="닫힌 칸 — 복원 목록에서 연다"')
        + '><div class="belt"></div>'
        + (live ? symMarkup(id) : '')
        + (live && T.isWild(id) ? '<div class="wildmark">대역</div>' : '')
        + (live && (S.locked || [])[k] ? '<div class="lockmark">🔒</div>' : '') + '</div>';
    }
    // 하우징이 창 위를 덮는다. 네 번째 칸이 열렸을 때만 그 칸을 하우징 위에 다시 그린다
    html += '<img class="sl" src="../UI/slots/slot-machine-housing.png" alt="">';
    if (N >= 4) {
      html += '<div class="win" style="left:' + (WIN_L + WIN_W * 3).toFixed(3) + '%;z-index:11">'
        + '<div class="belt"></div>' + symMarkup(S.stage[3]) + '</div>';
    }
    html += '<img class="sl" src="../UI/slots/slot-reroll-button-1.png" alt="">'
      + '<img class="sl" src="../UI/slots/slot-reroll-button-2.png" alt="">'
      + '<img class="sl" src="../UI/slots/slot-reroll-button-3.png" alt="">';
    sw.innerHTML = html;

    // 슬롯 밑 노브는 재굴림이 아니라 잠금이다. 잠근 칸은 재스핀에서 살아남는다.
    var free = S.freeReroll > 0;
    var lk = S.locked || [];
    for (var k2 = 0; k2 < N; k2++) {
      (function (k) {
        var kb = document.createElement('button');
        kb.className = 'knob' + (lk[k] ? ' lock' : '');
        // 노브 좌표는 버튼 PNG 의 실제 내용 경계에서 나왔다 (1024x592 기준 240/420/600)
        kb.style.left = (KNOB_L + KNOB_SP * k).toFixed(3) + '%';
        kb.title = (lk[k] ? '잠금 해제' : '이 칸을 잠근다') + ' — 무료';
        kb.innerHTML = '<i></i>';
        kb.onclick = function () { toggleLock(k); };
        sw.appendChild(kb);
      })(k2);
    }
    var openN = 0;
    for (var k3 = 0; k3 < N; k3++) if (!lk[k3]) openN++;

    var sp = document.createElement('button');
    sp.className = 'respin' + (free ? ' free' : '');
    sp.disabled = openN === 0 || (!free && S.cost < 1);
    sp.innerHTML = '🔁 재스핀 <b>' + openN + '칸</b>';
    sp.title = openN === 0 ? '전부 잠겨 있다 — 돌릴 칸이 없다'
      : (free ? '무료 재스핀 ' + S.freeReroll + '회 남음' : '재스핀 — 코스트 1');
    sp.onclick = doRespin;
    sw.appendChild(sp);

    var cap = document.createElement('div');
    cap.className = 'slotcap';
    cap.innerHTML = '슬롯 <b>' + N + ' / ' + T.CFG.stageMax + '</b> · 🔒 잠금은 무료'
      + (free ? ' · <b>재스핀 무료 ' + S.freeReroll + '회</b>' : ' · 재스핀 코스트 1');
    sw.appendChild(cap);

    el('banner').textContent = pend
      ? '표적을 고른다 — ' + pend.name
      : '턴 ' + (S.turn || 1) + ' · 무대가 올랐다';

    // ── 손패 ────────────────────────────────────────────────
    var hw = el('hw');
    var live2 = S.scripts.filter(function (s) {
      return T.canStage(s, S.stage, ctx.relax) && !S.sealed[s.id]; }).length;
    var hr = document.createElement('div'); hr.className = 'hrow';
    var add = function (sc, sealed) {
      var can = !sealed && Sim.canPlay(S, sc), staged = T.canStage(sc, S.stage, ctx.relax);
      var cc = Sim.costOf(S.ch, sc);
      var btn = document.createElement('button');
      btn.className = 'hc' + (can ? '' : ' dis') + (sc.temp ? ' temp' : '')
        + (sealed ? ' seal' : '') + (pend === sc ? ' pend' : '') + (tip === sc ? ' tip' : '');
      btn.title = sc.name + ' — ' + T.reqText(sc) + ' · ' + T.effText(sc.effect)
        + (cc > sc.cost ? '\n이 캐릭터는 다른 계열에 코스트를 더 낸다' : '');
      // 대본 베이스는 코스트별로 두께가 다르다 (UI/specs — 1·2·3)
      btn.innerHTML = '<img class="base" src="' + scriptBase(cc) + '" alt="">'
        + '<div class="cost">' + cc + '</div>'
        + '<div class="ok ' + (staged ? 'yes">✓' : 'no">✕') + '</div>'
        + (staged ? '' : '<div class="why">무대 조건 미충족</div>')
        + '<div class="ttl">' + sc.name + '</div>'
        + '<div class="req">' + reqMarkup(sc, S.stage, ctx.relax) + '</div>'
        + '<div class="eff">' + T.effText(sc.effect) + '</div>';
      if (can) {
        btn.onpointerdown = function (ev) { if (ev.button === 0) dragStart(ev, sc, btn); };
        btn.onclick = function (ev) { ev.preventDefault(); };   // 실제 발동은 dragEnd 가 한다
      }
      else btn.disabled = true;        // 못 누르는 것은 포커스도 먹지 않아야 한다
      hr.appendChild(btn);
    };
    S.temp.forEach(function (sc) { add(sc, false); });
    S.scripts.forEach(function (sc) { add(sc, !!S.sealed[sc.id]); });
    hw.appendChild(hr);
    hw.title = '무대 조건을 채운 대본 ' + live2 + '/' + S.scripts.length
      + (S.temp.length ? ' · 즉석 ' + S.temp.length : '');

    // ── 턴 종료 · 힌트 ───────────────────────────────────────
    var ac = el('acts');
    var e = document.createElement('button');
    e.className = 'end'; e.innerHTML = 'END<b>TURN</b>';
    e.onclick = endTurn; ac.appendChild(e);
    var h = document.createElement('button');
    h.textContent = '💡 추천 수';
    h.title = '봇이 이번 턴에 무엇을 먼저 둘지 계산해서 표시한다';
    h.onclick = showTip; ac.appendChild(h);

    render();
    flushFx();          // 이번 행동으로 생긴 숫자·흔들림을 무대에 올린다
  }

  // ── 공통 렌더 ─────────────────────────────────────────────
  function render() {
    el('ampTbl').innerHTML = T.AMP_TEXT.map(function (r) {
      return '<tr class="amprow"><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');
    el('cheerTbl').innerHTML = T.CHEER_TEXT.map(function (r) {
      return '<tr class="amprow"><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');

    var game = el('game');
    game.classList.toggle('run', !!S);
    game.classList.toggle('fight', !!S && inFight);

    if (!S) {
      el('tAct').textContent = '대역 — UNDERSTUDY';
      el('tHp').textContent = '—'; el('tCostNum').textContent = '—';
      el('tCost').innerHTML = ''; el('tRelics').innerHTML = ''; el('log').innerHTML = '';
      el('deck').innerHTML = ''; el('deckInfo').textContent = '—'; el('flags').innerHTML = '';
      el('scrTbl').innerHTML = ''; el('scrInfo').textContent = '—'; el('body').innerHTML = '';
      el('stage').innerHTML = '';
      return;
    }

    // 실린 규칙이 예상과 다르면 브라우저가 옛 스크립트를 붙들고 있는 것이다
    document.title = 'UNDERSTUDY — ' + T.CFG.floors + '층 · 캐릭터 '
      + Object.keys(T.CHARS).length + '종 · 공격 ×' + S.diff.atkMul;

    el('tAct').textContent = '제' + S.act + '막 · ' + (S.floor || 1) + '층 · ' + S.ch.name
      + ' · ' + S.diff.name + (S.asc.level ? ' 재연 ' + S.asc.level + '단' : '');

    var art = CHR_ART[S.chKey] || CHR_ART[S.ch.key];
    if (!art) {
      Object.keys(T.CHARS).forEach(function (k) { if (T.CHARS[k] === S.ch) art = CHR_ART[k]; });
    }
    // 개별 런타임 스프라이트는 attack·groggy 둘뿐이다 (UI/character/README).
    // 평상시엔 attack 을 앉은 자세로 쓰고, HP 가 바닥나면 groggy 로 바꾼다.
    var spr = el('chrSprite');
    if (art) {
      var low = S.hp <= S.maxHp * 0.25;
      var want = '../UI/character/' + art + (low ? '-groggy' : '-attack') + '.png';
      if (spr.getAttribute('src') !== want) spr.setAttribute('src', want);
    }

    el('tHp').textContent = Math.max(0, Math.round(S.hp)) + ' / ' + S.maxHp;
    el('tHpFill').style.width = Math.max(0, Math.min(100, S.hp / S.maxHp * 100)) + '%';
    el('tBlock').textContent = Math.round(S.block || 0);
    el('tThorns').textContent = Math.round(S.thorns || 0);
    el('tGold').textContent = S.gold;
    el('tTurn').textContent = S.turn || 0;

    var cheer = Math.round(S.cheer || 0), cmax = S.asc.cheerMax;
    el('tCheer').textContent = cheer + ' / ' + cmax;
    el('tCheerI').style.width = Math.min(100, cheer / cmax * 100) + '%';
    el('tCheerBar').classList.toggle('hot', cheer >= 40);

    // 소켓은 항상 절대 최대치 10개를 배치한다 (UI/specs)
    var mc = Sim.maxCost(S), cur = S.cost || 0, ss = '';
    for (var i = 0; i < 10; i++) {
      var kind = i < cur ? 'lit' : (i < mc ? 'empty' : 'locked');
      ss += '<img src="../UI/hud/cost/socket-' + kind + '.png" alt="">';
    }
    el('tCost').innerHTML = ss;
    el('tCostNum').innerHTML = cur + ' <s>/ ' + mc + '</s>';

    el('tRelics').innerHTML = (S.relics || []).map(function (k) {
      return '<span title="' + T.RELICS[k].name + ' — ' + T.RELICS[k].desc + '">' + T.RELICS[k].icon + '</span>';
    }).join('');

    var fl = [];
    if (S.foes && S.turn) {
      var stallAt = Math.max(4, T.CFG.stallTurn + S.asc.stallDelta)
        + (S.foes.some(function (f) { return f.boss; }) ? 6 : 0);
      if (S.turn >= stallAt) fl.push(['😠 야유 중 — 매 턴 적 공격 +10% · HP −' + S.asc.stallDmg, 1]);
      else if (stallAt - S.turn <= 3) fl.push(['😐 ' + (stallAt - S.turn) + '턴 후 야유', 0]);
      if (S.intrudeOn) fl.push(['🚪 ' + Math.max(0, S.intrudeOn - S.turn) + '턴 후 난입', 1]);
      // 「관객의 총아」 — 환호가 그대로 화력이다
      if (S.ch.cheerDmgPer) {
        var cm = 1 + Math.min(S.ch.cheerDmgCap || 0.7,
          Math.floor((S.cheer || 0) / 10) * S.ch.cheerDmgPer);
        fl.push(['🙌 환호 피해 ×' + cm.toFixed(2), 0]);
      }
      if (Sim.relicN(S, 'finalCurtain')) fl.push(['🎦 마지막 막 — ' + Math.max(0, 12 - S.turn) + '턴 남음', 1]);
      if (Sim.relicN(S, 'emptyHouse')) fl.push(['🕳 텅 빈 객석 — 야유도 환호도 없다', 0]);
      if (S.censor) fl.push(['✂️ ' + T.CARDS[S.censor.id].name + ' 봉인 ' + S.censor.turns + '턴', 1]);
      Object.keys(S.sealed || {}).forEach(function (id) {
        var s = T.SCRIPT_BY_ID[id]; fl.push(['📜 「' + (s ? s.name : id) + '」 압수됨', 1]);
      });
      S.foes.forEach(function (f) {
        if (f.hp > 0 && f.phased && f.clock != null) fl.push(['🔔 막 내림까지 ' + f.clock + '턴', 1]);
      });
    }
    el('flags').innerHTML = fl.map(function (x) {
      return '<span class="' + (x[1] ? 'warn' : '') + '">' + x[0] + '</span>'; }).join('');

    // 스크롤바를 만들지 않는다. 최근 줄만 남기고 아래에 붙인다.
    el('log').innerHTML = S.log.slice(-16).reverse().map(function (l) {
      return '<span class="' + l.c + '">' + l.t + '</span>'; }).join('<br>');

    var host = el('deck'); host.innerHTML = '';
    Object.keys(S.deck).sort().forEach(function (id) {
      var d = T.CARDS[id], n = document.createElement('span');
      n.className = 'card';
      n.innerHTML = cardIcon(id) + d.name + ' <b>' + S.deck[id] + '</b>';
      host.appendChild(n);
    });
    var by = {};
    Object.keys(S.deck).forEach(function (id) { var f = T.CARDS[id].fam; by[f] = (by[f] || 0) + S.deck[id]; });
    el('deckInfo').innerHTML = '칸 ' + Sim.deckSize(S) + '/' + T.CFG.reelMax
      + ' · 종류 ' + Object.keys(S.deck).length
      + '<br>' + T.FAMS.map(function (f) { return T.FAM_KO[f] + ' ' + (by[f] || 0); }).join(' · ');

    el('scrTbl').innerHTML = S.scripts.map(function (s) {
      var ok = S.stage ? T.canStage(s, S.stage, Sim.relicN(S, 'stand_in')) : false;
      var p = Math.round(Sim.stageProb(s, S.deck) * 100);
      return '<tr><td' + (ok ? ' style="color:#a8c49a"' : '') + '>' + s.name
        + (S.sealed && S.sealed[s.id] ? ' <span style="color:#b07a6a">압수</span>' : '')
        + '<br><span style="color:#6d6049">' + T.reqText(s) + ' · ' + T.effText(s.effect)
        + ' · 확률 ' + p + '%</span></td>'
        + '<td class="n">c' + s.cost + '</td></tr>';
    }).join('');
    el('scrInfo').textContent = '보유 ' + S.scripts.length + '/' + Sim.scriptCap(S)
      + ' · 최대 코스트 ' + Sim.maxCost(S);
  }

  // 기록 · 도감 — 화면 안에서 여닫는다
  el('btnLog').onclick = function () {
    this.classList.toggle('on', el('notes').classList.toggle('on'));
  };
  el('btnCodex').onclick = function () {
    this.classList.toggle('on', el('codex').classList.toggle('on'));
  };
  el('btnCodexClose').onclick = function () {
    el('codex').classList.remove('on'); el('btnCodex').classList.remove('on');
  };
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { el('codex').classList.remove('on'); el('btnCodex').classList.remove('on'); }
  });

  showTitle();
})();
</script>
</body>
</html>
