name: Deploy site to Pages

# 저장소를 그대로 올린다. 빌드 단계가 없는 이유는 index.html·tools/·UI/ 가
# 전부 정적 파일이고, play.html 이 engine.js 를 상대경로로 부르기 때문이다.
# 파일을 다른 곳으로 복사하면 사이트가 옛 규칙으로 굳는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치지 않게. 진행 중인 것을 죽이지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the repository as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
